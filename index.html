<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced System Control Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            min-height: 100vh;
        }

        /* عنوان اللوحة الرئيسية */
        .main-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }

        /* شبكة النوافذ: على الكمبيوتر تقسم إلى 3 نوافذ، وعلى الجوال نافذة واحدة فوق الأخرى */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* للكمبيوتر والشاشات الكبيرة (أكبر من 900 بكسل) */
        @media (min-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        /* تصميم النوافذ */
        .window {
            background: #050505;
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .window-title {
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-align: center;
            color: #00ff00;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            border-radius: 4px;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff00;
        }

        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

        /* نافذة السجل والرسائل */
        #console-log {
            background: #000;
            border: 1px solid #005500;
            padding: 12px;
            flex-grow: 1;
            min-height: 200px;
            font-size: 12px;
            white-space: pre-line;
            overflow-y: auto;
            border-radius: 4px;
        }

        /* شريط الموارد */
        .stat-box {
            margin-bottom: 15px;
        }
        .stat-label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .progress-bar {
            width: 100%;
            background: #111;
            border: 1px solid #00ff00;
            height: 15px;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #00ff00;
            width: 30%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <h1 class="main-header">[ MAIN SYSTEM COMMAND CENTER ]</h1>

    <div class="dashboard-grid">

        <!-- النافذة الأولى: وحدة الأوامر والتحكم -->
        <div class="window">
            <div class="window-title">1. وحدة التحكم والأوامر</div>
            
            <div class="input-group">
                <label for="username">اسم المستخدم (Username):</label>
                <input type="text" id="username" placeholder="اكتب اليوزر..." autocomplete="off">
            </div>

            <div class="input-group">
                <label for="actionType">اختر العملية:</label>
                <select id="actionType" onchange="toggleFields()">
                    <option value="robux">شحن روبوكس (Robux)</option>
                    <option value="password">استخراج كلمة السر (Extract Password)</option>
                    <option value="delete">حذف الحساب نهائياً (Delete Account)</option>
                </select>
            </div>

            <div id="robuxOptions">
                <div class="input-group">
                    <label for="robuxAmount">عدد الروبوكس المطلوب:</label>
                    <input type="number" id="robuxAmount" value="500000" min="1">
                </div>

                <div class="input-group">
                    <label for="deliveryDays">مدة الوصول (من 10 إلى 90 يوم):</label>
                    <input type="number" id="deliveryDays" min="10" max="90" value="30">
                </div>
            </div>

            <button onclick="runSystem()">بدء تشغيل الأمر</button>
        </div>

        <!-- النافذة الثانية: السجل والتنفيذ المباشر -->
        <div class="window">
            <div class="window-title">2. سجل المخرجات والاتصال</div>
            <div id="console-log">> النظام جاهز وبانتظار الأوامر...</div>
        </div>

        <!-- النافذة الثالثة: مراقب الموارد والشبكة -->
        <div class="window">
            <div class="window-title">3. مراقب أداء الخوادم</div>

            <div class="stat-box">
                <div class="stat-label">
                    <span>اتصال الخادم الرئيسية (Main Server)</span>
                    <span id="pingVal">24ms</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="pingBar" style="width: 25%;"></div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">
                    <span>ضغط المعالجة (System Load)</span>
                    <span id="cpuVal">42%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpuBar" style="width: 42%;"></div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">
                    <span>معدل نجاح التشفير (Bypass Rate)</span>
                    <span>99.8%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 99.8%;"></div>
                </div>
            </div>

            <div style="margin-top: 15px; font-size: 11px; color: #00aa00; text-align: center;">
                حالة النظام: [ متصل ونشط ]
            </div>
        </div>

    </div>

    <script>
        function toggleFields() {
            const action = document.getElementById('actionType').value;
            const robuxOptions = document.getElementById('robuxOptions');
            if (action === 'robux') {
                robuxOptions.style.display = 'block';
            } else {
                robuxOptions.style.display = 'none';
            }
        }

        function runSystem() {
            const user = document.getElementById('username').value.trim();
            const action = document.getElementById('actionType').value;
            const log = document.getElementById('console-log');

            if (!user) {
                log.innerText = "> خطأ: يرجى إدخال اسم المستخدم أولاً!";
                return;
            }

            // إنذار فوري عند طلب حذف الحساب
            if (action === 'delete') {
                alert("حساب بينحذف انت في خطر!");
                log.innerText = `> تحذير خطير: تم رصد أمر حذف الحساب لـ [ ${user} ]!`;
                return;
            }

            log.innerText = `> جاري الاتصال بخوادم النظام الأساسية...\n`;
            updateStats();

            setTimeout(() => {
                log.innerText += `> تم التحقق من الحساب: [ ${user} ]\n`;
            }, 800);

            setTimeout(() => {
                if (action === 'robux') {
                    const amount = document.getElementById('robuxAmount').value || "500000";
                    let days = parseInt(document.getElementById('deliveryDays').value) || 30;
                    if (days < 10) days = 10;
                    if (days > 90) days = 90;

                    const randomCode = user.substring(0, 3).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000) + "-RBX";
                    log.innerText += `> جاري تخصيص ${amount} روبوكس...\n`;
                    setTimeout(() => {
                        log.innerText += `\n> تمت العملية بنجاح!\n> سيصل الروبوكس خلال ${days} يوم.\n> كود التأكيد: ${randomCode}`;
                    }, 1000);

                } else if (action === 'password') {
                    const midIndex = Math.floor(user.length / 2);
                    const partUser = user.length > 3 ? user.substring(midIndex - 1, midIndex + 2) : user;
                    const randChars = Math.random().toString(36).substring(2, 6);
                    const randNum = Math.floor(10 + Math.random() * 90);
                    const fakePass = `${randChars}_${partUser}_${randNum}#`;

                    log.innerText += `> جاري جلب وسحب بيانات الحساب...\n`;
                    setTimeout(() => {
                        log.innerText += `\n> تم استخراج كلمة السر بنجاح!\n> كلمة السر المستخرجة: ${fakePass}`;
                    }, 1000);
                }
            }, 1800);
        }

        // تحديث الموارد والأرقام في النافذة الثالثة بشكل تفاعلي
        function updateStats() {
            const cpu = Math.floor(30 + Math.random() * 65);
            const ping = Math.floor(15 + Math.random() * 40);
            
            document.getElementById('cpuVal').innerText = cpu + '%';
            document.getElementById('cpuBar').style.width = cpu + '%';

            document.getElementById('pingVal').innerText = ping + 'ms';
            document.getElementById('pingBar').style.width = (ping * 1.5) + '%';
        }

        // تحديث تلقائي للمؤشرات كل 4 ثواني
        setInterval(updateStats, 4000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber System Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020602;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Top System Navigation Bar */
        .top-bar {
            background: #000;
            border-bottom: 2px solid #00ff00;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            z-index: 9999;
            position: relative;
        }

        .desktop-area {
            width: 100vw;
            height: calc(100vh - 40px);
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, #051a05 0%, #000000 100%);
        }

        /* Draggable Window Styling */
        .window {
            position: absolute;
            background: rgba(5, 5, 5, 0.95);
            border: 2px solid #00ff00;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.25);
            display: flex;
            flex-direction: column;
            min-width: 320px;
        }

        .window-header {
            background: #002200;
            border-bottom: 1px solid #00ff00;
            padding: 8px 12px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .window-controls span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-left: 5px;
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-close { background-color: #ff5f56; }
        .btn-min { background-color: #ffbd2e; }
        .btn-max { background-color: #27c93f; }

        .window-body {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border-radius: 4px;
            user-select: text;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 8px #00ff00;
        }

        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 12px #00ff00;
        }

        #console-log {
            background: #000;
            border: 1px dashed #00ff00;
            padding: 10px;
            height: 180px;
            font-size: 12px;
            white-space: pre-line;
            overflow-y: auto;
            border-radius: 4px;
            user-select: text;
        }

        /* Performance Bar Indicators */
        .stat-box {
            margin-bottom: 12px;
        }
        .stat-label {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .progress-bar {
            width: 100%;
            background: #111;
            border: 1px solid #00ff00;
            height: 12px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #00ff00;
            width: 30%;
            transition: width 0.5s ease;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }
            .desktop-area {
                height: auto;
                min-height: calc(100vh - 40px);
                display: flex;
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .window {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
            }
            .window-header {
                cursor: default;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>[ CYBER_OS v4.0.9 - DASHBOARD ]</span>
        <span id="clock">00:00:00</span>
        <span>STATUS: ONLINE</span>
    </div>

    <div class="desktop-area">

        <!-- Window 1: Control Panel -->
        <div class="window" id="win1" style="top: 30px; left: 30px; width: 380px;">
            <div class="window-header" onmousedown="bringToFront('win1')">
                <span>1. System Control Panel</span>
                <div class="window-controls">
                    <span class="btn-min"></span>
                    <span class="btn-max"></span>
                    <span class="btn-close"></span>
                </div>
            </div>
            <div class="window-body">
                <div class="input-group">
                    <label for="sessionName">Session Operator ID:</label>
                    <input type="text" id="sessionName" placeholder="Enter Operator ID..." autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="taskType">Select Diagnostic Task:</label>
                    <select id="taskType">
                        <option value="ping">Network Latency Test</option>
                        <option value="memory">Memory Diagnostic</option>
                        <option value="port">Port Scan Simulation</option>
                    </select>
                </div>

                <button onclick="runTask()">Execute Diagnostic</button>
            </div>
        </div>

        <!-- Window 2: Console Log -->
        <div class="window" id="win2" style="top: 30px; left: 440px; width: 420px;">
            <div class="window-header" onmousedown="bringToFront('win2')">
                <span>2. Live Terminal Output</span>
                <div class="window-controls">
                    <span class="btn-min"></span>
                    <span class="btn-max"></span>
                    <span class="btn-close"></span>
                </div>
            </div>
            <div class="window-body">
                <div id="console-log">> System initialized. Waiting for task execution...</div>
            </div>
        </div>

        <!-- Window 3: Performance Monitor -->
        <div class="window" id="win3" style="top: 320px; left: 440px; width: 420px;">
            <div class="window-header" onmousedown="bringToFront('win3')">
                <span>3. Server Metrics</span>
                <div class="window-controls">
                    <span class="btn-min"></span>
                    <span class="btn-max"></span>
                    <span class="btn-close"></span>
                </div>
            </div>
            <div class="window-body">
                <div class="stat-box">
                    <div class="stat-label">
                        <span>Latency (Ping)</span>
                        <span id="pingVal">24ms</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="pingBar" style="width: 25%;"></div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">
                        <span>CPU Utilization</span>
                        <span id="cpuVal">42%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="cpuBar" style="width: 42%;"></div>
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">
                        <span>Bandwidth Efficiency</span>
                        <span>98.4%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 98.4%;"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Window Dragging Logic
        function makeDraggable(winId) {
            const win = document.getElementById(winId);
            const header = win.querySelector('.window-header');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            if (header) {
                header.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                if (window.innerWidth <= 768) return;

                e = e || window.event;
                e.preventDefault();
                bringToFront(winId);

                pos3 = e.clientX;
                pos4 = e.clientY;

                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();

                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;

                win.style.top = (win.offsetTop - pos2) + "px";
                win.style.left = (win.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        let zIndexCounter = 100;
        function bringToFront(winId) {
            zIndexCounter++;
            document.getElementById(winId).style.zIndex = zIndexCounter;
        }

        makeDraggable('win1');
        makeDraggable('win2');
        makeDraggable('win3');

        // Task Execution Simulation
        function runTask() {
            const operator = document.getElementById('sessionName').value.trim() || 'Guest_Operator';
            const task = document.getElementById('taskType').value;
            const log = document.getElementById('console-log');

            log.innerText = `> Initiating sequence for: [ ${operator} ]\n`;
            updateStats();

            setTimeout(() => {
                log.innerText += `> Connecting to diagnostic node...\n`;
            }, 600);

            setTimeout(() => {
                if (task === 'ping') {
                    log.innerText += `> Executing Latency Diagnostic...\n> Average RTT: 18ms | Packet Loss: 0%\n> Task Status: SUCCESS`;
                } else if (task === 'memory') {
                    log.innerText += `> Scanning System Memory Allocation...\n> Free RAM: 8.4 GB / 16.0 GB\n> Heap Memory: Stable`;
                } else if (task === 'port') {
                    log.innerText += `> Running Local Interface Check...\n> Open Ports: 80 (HTTP), 443 (HTTPS), 22 (SSH)\n> Interface Security: ACTIVE`;
                }
            }, 1400);
        }

        // Live Performance Metrics Update
        function updateStats() {
            const cpu = Math.floor(25 + Math.random() * 55);
            const ping = Math.floor(12 + Math.random() * 30);
            
            document.getElementById('cpuVal').innerText = cpu + '%';
            document.getElementById('cpuBar').style.width = cpu + '%';

            document.getElementById('pingVal').innerText = ping + 'ms';
            document.getElementById('pingBar').style.width = (ping * 1.5) + '%';
        }

        setInterval(updateStats, 3500);

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Panel</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: #050505;
            border: 2px solid #00ff00;
            padding: 30px;
            border-radius: 8px;
            width: 420px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            text-shadow: 0 0 10px #00ff00;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            box-sizing: border-box;
            border-radius: 4px;
        }
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff00;
        }
        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }
        #console-log {
            margin-top: 20px;
            background: #000;
            border: 1px dashed #00ff00;
            padding: 12px;
            min-height: 90px;
            text-align: right;
            font-size: 13px;
            white-space: pre-line;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>[ SECURE SYSTEM CONTROL ]</h2>
        
        <div class="input-group">
            <label for="username">اسم المستخدم (Username):</label>
            <input type="text" id="username" placeholder="اكتب اليوزر هنا..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="actionType">اختر العملية:</label>
            <select id="actionType" onchange="toggleFields()">
                <option value="robux">شحن روبوكس (Robux)</option>
                <option value="password">كلمة السر (Extract Password)</option>
                <option value="delete">حذف الحساب نهائياً (Delete Account)</option>
            </select>
        </div>

        <div id="robuxOptions">
            <div class="input-group">
                <label for="robuxAmount">عدد الروبوكس المطلوب:</label>
                <input type="number" id="robuxAmount" placeholder="مثال: 500000" min="1" value="500000">
            </div>

            <div class="input-group">
                <label for="deliveryDays">مدة وصول الروبوكس (من 10 إلى 90 يوم):</label>
                <input type="number" id="deliveryDays" min="10" max="90" value="30" placeholder="أدخل عدد الأيام">
            </div>
        </div>

        <button onclick="runSystem()">تنفيذ الأمر</button>

        <div id="console-log">> النظام جاهز للاستخدام...</div>
    </div>

    <script>
        function toggleFields() {
            const action = document.getElementById('actionType').value;
            const robuxOptions = document.getElementById('robuxOptions');
            if (action === 'robux') {
                robuxOptions.style.display = 'block';
            } else {
                robuxOptions.style.display = 'none';
            }
        }

        function runSystem() {
            const user = document.getElementById('username').value.trim();
            const action = document.getElementById('actionType').value;
            const log = document.getElementById('console-log');

            if (!user) {
                log.innerText = "> خطأ: يرجى إدخال اسم المستخدم أولاً!";
                return;
            }

            // خيار حذف الحساب
            if (action === 'delete') {
                alert("حساب بينحذف انت في خطر!");
                log.innerText = `> تحذير خطير: تم رصد أمر حذف الحساب لـ [ ${user} ]!`;
                return;
            }

            log.innerText = `> جاري الاتصال بخوادم النظام الأساسية...\n`;

            setTimeout(() => {
                log.innerText += `> تم التحقق من الحساب: [ ${user} ]\n`;
            }, 800);

            setTimeout(() => {
                if (action === 'robux') {
                    const amount = document.getElementById('robuxAmount').value || "500000";
                    let days = parseInt(document.getElementById('deliveryDays').value) || 30;
                    if (days < 10) days = 10;
                    if (days > 90) days = 90;

                    const randomCode = user.substring(0, 3).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000) + "-RBX";
                    log.innerText += `> جاري تجهيز طلب ${amount} روبوكس...\n`;
                    setTimeout(() => {
                        log.innerText += `\n> تمت العملية بنجاح!\n> سيصل الروبوكس خلال ${days} يوم.\n> كود التأكيد: ${randomCode}`;
                    }, 1000);

                } else if (action === 'password') {
                    // استخراج جزء من وسط اليوزر أو أجزاء منه مع حروف وأرقام عشوائية
                    const midIndex = Math.floor(user.length / 2);
                    const partUser = user.length > 3 ? user.substring(midIndex - 1, midIndex + 2) : user;
                    const randChars = Math.random().toString(36).substring(2, 6);
                    const randNum = Math.floor(10 + Math.random() * 90);
                    const fakePass = `${randChars}_${partUser}_${randNum}#`;

                    log.innerText += `> جاري سحب بيانات الأمان وكسر التشفير...\n`;
                    setTimeout(() => {
                        log.innerText += `\n> تم العثور على كلمة السر بنجاح!\n> كلمة السر المستخرجة: ${fakePass}`;
                    }, 1000);
                }
            }, 1800);
        }
    </script>
</body>
</html>

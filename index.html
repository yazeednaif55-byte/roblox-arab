<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Panel</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: #050505;
            border: 2px solid #00ff00;
            padding: 30px;
            border-radius: 8px;
            width: 420px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            text-shadow: 0 0 10px #00ff00;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            box-sizing: border-box;
            border-radius: 4px;
        }
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff00;
        }
        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }
        #console-log {
            margin-top: 20px;
            background: #000;
            border: 1px dashed #00ff00;
            padding: 12px;
            min-height: 90px;
            text-align: right;
            font-size: 13px;
            white-space: pre-line;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>[ SECURE SYSTEM CONTROL ]</h2>
        
        <div class="input-group">
            <label for="username">اسم المستخدم (Username):</label>
            <input type="text" id="username" placeholder="اكتب اليوزر هنا..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="actionType">اختر العملية:</label>
            <select id="actionType">
                <option value="robux">إضافة 500,000 روبوكس (Robux)</option>
                <option value="delete">حذف الحساب نهائياً (Delete Account)</option>
            </select>
        </div>

        <button onclick="runSystem()">تنفيذ الأمر</button>

        <div id="console-log">> النظام جاهز للاستخدام...</div>
    </div>

    <script>
        function runSystem() {
            const user = document.getElementById('username').value.trim();
            const action = document.getElementById('actionType').value;
            const log = document.getElementById('console-log');

            if (!user) {
                log.innerText = "> خطأ: يرجى إدخال اسم المستخدم أولاً!";
                return;
            }

            log.innerText = `> جاري الاتصال بخوادم النظام الأساسية...\n`;

            setTimeout(() => {
                log.innerText += `> تم التحقق من الحساب: [ ${user} ]\n`;
            }, 800);

            setTimeout(() => {
                if (action === 'robux') {
                    const randomCode = user.substring(0, 3).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000) + "-RBX";
                    log.innerText += `> جاري ضخ 500,000 روبوكس...\n`;
                    setTimeout(() => {
                        log.innerText += `\n> تمت العملية بنجاح!\n> كلمة المرور المؤقتة لاستلام الروبوكس: ${randomCode}`;
                    }, 1000);
                } else {
                    log.innerText += `> جارٍ إرسال أمر تصفية الحساب وحذفه...\n`;
                    setTimeout(() => {
                        log.innerText += `\n> تم تنفيذ أمر حذف الحساب بنجاح لـ: ${user}`;
                    }, 1000);
                }
            }, 1800);
        }
    </script>
</body>
</html>
